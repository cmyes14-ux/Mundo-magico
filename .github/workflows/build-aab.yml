name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK environment
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Prepare web assets (index.html)
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp "index.html" www/index.html
          elif [ -f "mundomágico.html" ]; then
            cp "mundomágico.html" www/index.html
          elif [ -f "Mundo Mágico.html" ]; then
            cp "Mundo Mágico.html" www/index.html
          else
            echo "No HTML file found" && exit 1
          fi

      - name: Initialize Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mundo Magico" "com.mundomagicodebruno.myapp" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Add microphone permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c '
          import xml.etree.ElementTree as ET
          p = "'$MANIFEST'"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(p)
          root = tree.getroot()
          perm_name = "{http://schemas.android.com/apk/res/android}name"
          perm_val = "android.permission.RECORD_AUDIO"
          exists = any(el.tag.endswith("uses-permission") and el.attrib.get(perm_name) == perm_val for el in root)
          if not exists:
              elem = ET.Element("uses-permission", {perm_name: perm_val})
              root.insert(0, elem)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          '

      - name: Build signed release AAB
        run: |
          cd android
          keytool -genkeypair -v -keystore release.keystore -alias mundomagico -keyalg RSA -keysize 2048 -validity 10000 -storepass MundoMagico2026 -keypass MundoMagico2026 -dname "CN=Mundo Magico, OU=App, O=Mundo Magico, L=City, S=State, C=ES"
          ./gradlew bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=MundoMagico2026 \
            -Pandroid.injected.signing.key.alias=mundomagico \
            -Pandroid.injected.signing.key.password=MundoMagico2026

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mundo-magico-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
